name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Matches NODE_VERSION in the Cloudflare Pages build settings.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is not committed, so npm ci is not available.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build the London site
        run: npm run build:london
